<!doctype html>
<html lang="en-CA">
<head><script src="student-homework-access.js?v=20261123-only-week-v2" data-homework-entry="archive"></script>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Show 38 in two ways</title>
 <script src="november-car-groups.js?v=20261115stacked-car-cards"></script>
 <script>
  const engineStyles=document.createElement('style');
  engineStyles.textContent=window.ML_NOVEMBER_CAR_GROUPS_ENGINE.styles;
  document.head.append(engineStyles);
 </script>
 <style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{display:grid;grid-template-rows:minmax(0,1fr) auto;background:#eaf4f8;color:#193b47;font:clamp(15px,2vw,22px)/1.2 "Trebuchet MS",sans-serif}
  h1,p{margin:0}
  h1{font-size:clamp(24px,4.2vw,53px);line-height:1.08}
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid #8250b5;outline-offset:2px}
  .activity{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;padding-inline:clamp(6px,1.25vw,18px)}
  .prompt{font-size:clamp(15px,2.1vw,24px)}
  footer{display:flex;justify-content:flex-end;padding:5px clamp(7px,1.25vw,18px) 8px;background:#dcecf3;border-top:1px solid #abd0dc}
  #check{min-height:44px;border:1px solid #7c4c1b;border-radius:9px;background:#a94310;color:white;padding:3px 14px;font-weight:bold}
  #check[data-result="correct"]{background:#176f49;border-color:#155d40}
  @media print{
   @page{size:landscape;margin:10mm}
   html,body{height:auto;overflow:visible}
   body{display:block;print-color-adjust:exact;-webkit-print-color-adjust:exact}
   footer{display:none}
  }
 </style>
</head>
<body>
 <main class="activity"></main>
 <footer><button type="button" id="check">Check my work</button></footer>
 <script>
  window.ML_CONFIG={
   student:'guest',id:'branch18',revision:'v1',
   task:{
    target:38,title:'Show 38 in two ways',
    prompt:'Drag groups of cars onto both landing pads. Make 38 a different way on each pad.',
    picture:new URL('assets/audit-oct25-v9/toy-car-no-eyes.png',location.href).href
   }
  };
  window.ML_NOVEMBER_CAR_GROUPS_ENGINE.boot();
  const check=document.getElementById('check');
  function showResult(assessment){
   check.dataset.result=assessment.correct?'correct':'';
   check.textContent=assessment.correct?'✓ Correct!':assessment.checked?'Check · '+assessment.score+'/'+assessment.total:'Check my work';
  }
  showResult(window.ML_ENGINE.get().assessment);
  check.addEventListener('click',()=>showResult(window.ML_ENGINE.check().assessment));
  window.addEventListener('message',event=>{
   if(event.source===window&&event.data?.id===window.ML_CONFIG.id)showResult(window.ML_ENGINE.get().assessment);
  });
 </script>
</body>
</html>
