<!doctype html>
<html lang="en-CA">
<head><script src="student-homework-access.js?v=20261123-only-week-v2" data-homework-entry="archive"></script>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Add 58 + 44</title>
 <script src="november-vertical-addition.js?v=20261115carry-ladder"></script>
 <script>
  const engineStyles = document.createElement('style');
  engineStyles.textContent = window.ML_NOVEMBER_VERTICAL_ENGINE.styles;
  document.head.append(engineStyles);
 </script>
 <style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;color:#193b47;background:#eaf4f8;font:clamp(15px,2.2vw,22px)/1.2 "Trebuchet MS",sans-serif}
  h1,p{margin:0}
  h1{font-size:clamp(26px,5vw,56px);color:#174e4f}
  button{font:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible{outline:3px solid #8250b5;outline-offset:2px}
  .activity{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;padding-inline:clamp(6px,1.25vw,18px)}
  .prompt{font-size:clamp(15px,2.2vw,24px)}
  .status-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:5px clamp(7px,1.25vw,18px) 8px;background:#dcecf3;border-top:1px solid #abd0dc}
  .status-bar button{min-height:44px;border-radius:9px;border:1px solid #7c4c1b;background:#a94310;color:white;padding:3px 14px;font-weight:bold}
  .status-bar button[data-result="correct"]{background:#176f49;border-color:#155d40}
  @media(max-height:450px){
   h1{font-size:clamp(22px,4vw,32px)}
   .status-bar button{min-height:35px}
  }
  @media print{
   @page{size:landscape;margin:10mm}
   html,body{height:auto;overflow:visible}
   body{display:block;print-color-adjust:exact;-webkit-print-color-adjust:exact}
   .status-bar{display:none}
  }
 </style>
</head>
<body>
 <main class="activity"></main>
 <footer class="status-bar"><button type="button" id="check">Check my work</button></footer>
 <script>
  window.ML_CONFIG = {
   student:'guest',id:'catpaddle-58-plus-44',revision:'v1',grade:3,
   task:{
    title:'Add 58 + 44',addends:[58,44],blockRows:true,
    prompt:'Choose the full column total. Drag the 1 to the next carry box when you regroup.'
   }
  };
  window.ML_NOVEMBER_VERTICAL_ENGINE.boot();
  const check = document.getElementById('check');
  function showResult(assessment){
   if(!assessment.checked){
    delete check.dataset.result;
    check.textContent = 'Check my work';
    return;
   }
   check.dataset.result = assessment.correct ? 'correct' : 'again';
   check.textContent = assessment.correct ? '✓ Correct!' : 'Check · '+assessment.score+'/'+assessment.total;
  }
  showResult(window.ML_ENGINE.get().assessment);
  check.addEventListener('click',()=>showResult(window.ML_ENGINE.check().assessment));
  window.addEventListener('message',event=>{
   if(event.source===window && event.data?.id===window.ML_CONFIG.id) showResult(window.ML_ENGINE.get().assessment);
  });
 </script>
</body>
</html>
